name: Generate contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sam-Bonfire
          outputs: |
            dist/github-snake.svg?color_snake=#FF7139&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF7139&color_dots=#0e4429,#006d32,#26a641,#39d353
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update contribution snake"
          file_pattern: dist/*.svg
